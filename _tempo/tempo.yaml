# Local Tempo. Only Alloy talks to it — the app must not point here directly,
# mirroring the cluster where Tempo is unreachable from app namespaces.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 336h  # 14 days, as in the cluster

usage_report:
  reporting_enabled: false
