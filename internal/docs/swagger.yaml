basePath: /api/v1
host: localhost:8080
info:
  contact:
    email: contact@effiware.com
    name: Effi-Support
    url: https://www.effiware.com/contact
  description: This is an example server for a GOTH template application.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: GOTH Template API
  version: "1.0"
paths:
  /applications:
    get:
      consumes:
      - application/json
      description: List assigned applications for the authenticated user
      produces:
      - application/json
      responses: {}
      summary: List assigned applications
      tags:
      - applications
  /organization:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      summary: Get organization
      tags:
      - organization
schemes:
- http
swagger: "2.0"
