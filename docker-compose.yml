networks:
  cloak-apps-net:
    external: false
    name: cloak-apps-net

volumes:
  keycloak-db:
    labels:
      - "dev.cloakapps.description=Keycloak own database storage"
  loki-data:
    labels:
      - "dev.cloakapps.description=Loki chunks and index"
  tempo-data:
    labels:
      - "dev.cloakapps.description=Tempo trace blocks"
  grafana-data:
    labels:
      - "dev.cloakapps.description=Grafana dashboards and preferences"

services:
  cloak-apps:
    container_name: cloak-apps
    image: effiware/cloak-apps:${BUILD_VERSION:-0.0.1}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_VERSION: ${BUILD_VERSION:-0.0.1}
        BUILD_HASH: ${BUILD_HASH:-abcd123}
    platform: linux/amd64
    restart: unless-stopped
    profiles:
      - whole
    depends_on:
      - keycloak
      - alloy
    networks:
      - cloak-apps-net
    # Alloy reads these to build the Loki labels, exactly as it reads the pod's
    # app.kubernetes.io/name and namespace in the cluster.
    labels:
      app.kubernetes.io/name: cloak-apps
      namespace: ${LOG_NAMESPACE:-dev-v1}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
      - "${TEMPL_PROXY_PORT}:${TEMPL_PROXY_PORT}"
    environment:
      - CLOAKAPPS_SERVER_ENVIRONMENT=${ENV}
      - CLOAKAPPS_SERVER_PORT=${SERVER_PORT}
      - CLOAKAPPS_KEYCLOAK_URL=http://keycloak:${KEYCLOAK_PORT}
      - CLOAKAPPS_KEYCLOAK_REDIRECT_URI=http://localhost:${SERVER_PORT}/auth/callback
      # Alloy is the only collector — never point at Tempo directly.
      - CLOAKAPPS_OTLP_URL=alloy:4317
      - CLOAKAPPS_OTLP_PROTOCOL=grpc
      - CLOAKAPPS_OTLP_SECURE=false
      - OTEL_SERVICE_NAME=cloak-apps
    volumes:
      - ./config.yaml:/app/config.yaml:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: cloak-apps-keycloak
    depends_on:
      - keycloak-db
    networks:
      - cloak-apps-net
    ports:
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./keycloak-server.crt.pem:/opt/keycloak/keycloak-server.crt.pem:ro
      - ./keycloak-server.key.pem:/opt/keycloak/keycloak-server.key.pem:ro
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_PASSWORD: STRONG_DB_PASSWORD2
      KC_DB_USERNAME: keycloak
      KC_DB_SCHEMA: public
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
      # --hostname=http://auth.cloakapps.localhost
    command: |
      start-dev
      --http-enabled=true
      --http-port=${KEYCLOAK_PORT}
      --https-port=443
      --hostname-strict=false
      --https-certificate-file=/opt/keycloak/keycloak-server.crt.pem
      --https-certificate-key-file=/opt/keycloak/keycloak-server.key.pem
      -Dkeycloak.profile.feature.token_exchange=enabled
      -Dkeycloak.profile.feature.admin_fine_grained_authz=enabled

  keycloak-db:
    image: postgres:16-alpine
    container_name: cloak-apps-keycloak-db
    networks:
      - cloak-apps-net
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD2

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: cloak-apps-alloy
    restart: unless-stopped
    profiles:
      - whole
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${ALLOY_PORT:-8087}:12345"
    volumes:
      - ./_alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only: Alloy discovers containers and tails their stdout.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - tempo
    networks:
      - cloak-apps-net

  loki:
    image: grafana/loki:3.7.6
    container_name: cloak-apps-loki
    restart: unless-stopped
    profiles:
      - whole
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "${LOKI_PORT:-8085}:3100"
    volumes:
      - ./_loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - cloak-apps-net

  tempo:
    image: grafana/tempo:2.10.8
    container_name: cloak-apps-tempo
    restart: unless-stopped
    profiles:
      - whole
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "${TEMPO_PORT:-8086}:3200"
    volumes:
      - ./_tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - cloak-apps-net

  grafana:
    image: grafana/grafana:12.3.0
    container_name: cloak-apps-grafana
    restart: unless-stopped
    profiles:
      - whole
    ports:
      - "${GRAFANA_PORT:-8083}:3000"
    volumes:
      - ./_grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Local only: the cluster's Grafana is behind SSO.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - loki
      - tempo
    networks:
      - cloak-apps-net

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: cloak-apps-prometheus
    restart: unless-stopped
    profiles:
      - whole
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./_prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    networks:
      - cloak-apps-net