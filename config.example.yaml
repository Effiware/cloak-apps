organization:
  name: "Effiware"
#  custom_description: "Foo <b>Bar</b>"
  
keycloak:
  url: "http://localhost:8082"
  realm: "cloak-apps-realm"
  client_id: "cloak-apps-portal"
  client_secret: "<PASTE_CLIENT_SECRET_FROM_KEYCLOAK>"
  redirect_uri: "http://localhost:8080/auth/callback"

server:
  port: 8080
#  host: "localhost"
#  timeout: 10
  log_level: "DEBUG"
  refresh_interval_min: 5  # 5min by default

session:
  secret: "<GENERATE_RANDOM_SECRET_32_CHARS>"
  max_age: 3600  # 1 hour by default
#  secure: false  # needed on local environment or when no HTTPS enabled

  # Session store: "filesystem" (default), "cookie", "redis"
  # See THREE-TIER-PLAN.md for details
  store: "filesystem"

  # Cookie store with introspection (Tier 2)
#  cookie_introspection: true
#  introspection_cache_ttl: 15  # seconds

  # Redis store (Tier 3 - not yet implemented)
#  redis_url: "redis://localhost:6379/0"

